<script>

/* =========================
基本
========================= */

let floor=1;
let level=1;
let exp=0;
let expMax=10;

let playerMax=100;
let playerHP=100;

let playerMaxMP=50;
let playerMP=50;

let attack=5;
let defense=2;

let gold=100;

let enemy="";
let enemyHP=0;
let enemyMax=0;

let auto=false;

let inventory=[];

let equipped={
sword:null,
armor:null,
ring:null
};

let logHistory=[];

let battleEnd=false;

let critRate=0.05;
let critDamage=2;

let playerFreeze=0;
let playerParalyze=0;

let enemyFreeze=0;
let enemyParalyze=0;

let isBackTower=false;
let backTowerUnlocked=false;

let battleToken=0;


/* =========================
自動売却設定
========================= */

let autoSellEnabled=false;
let autoSellLimit=30;
let autoSellRarity=0;

let autoSellATK=20;
let autoSellDEF=15;
let autoSellMP=10;
let autoSellPlus=9;

let autoSellRequireAll=true;


/* =========================
レアリティ
========================= */

const rarities=[

{
name:"common",
label:"通常",
mult:1,
color:"common"
},

{
name:"rare",
label:"レア",
mult:1.4,
color:"rare"
},

{
name:"epic",
label:"エピック",
mult:2,
color:"epic"
},

{
name:"legend",
label:"レジェンド",
mult:3,
color:"legend"
},

{
name:"mythic",
label:"ミシック",
mult:5,
color:"mythic"
}

];


/* =========================
ログ
========================= */

function log(t){

logHistory.unshift(t);

if(logHistory.length>8){
logHistory.pop();
}

document.getElementById(
"log"
).innerHTML=
logHistory.join("<br>");

}


/* =========================
ダメージ
========================= */

function calcDamage(base){

let isCrit=
Math.random()<critRate;

let dmg=base;

if(isCrit){

dmg*=critDamage;

log("💥クリティカル！");

}

return Math.max(
1,
Math.floor(dmg)
);

}


/* =========================
敵生成
========================= */

function spawnEnemy(){

battleEnd=false;

battleToken++;

enemyFreeze=0;
enemyParalyze=0;

let scale=
isBackTower
?2.5
:1;

let list=[
"スライム",
"ゴブリン",
"オオカミ",
"骸骨",
"魔法使い",
"ダークナイト"
];

enemy=
list[
Math.floor(
Math.random()*list.length
)
];

enemyMax=
Math.floor(
(20+floor*6)*scale
);


/* 50階ボス */

if(floor%50===0){

enemy="🐉階層ボス";

enemyMax=
Math.floor(
(250+floor*15)*scale
);

}


/* 200階最終ボス */

if(
!isBackTower &&
floor===200
){

enemy="👑塔の最終ボス";

enemyMax=10000;

}


/* 裏の塔ボス */

if(
isBackTower &&
floor%50===0
){

enemy="🌌裏の階層ボス";

enemyMax=
Math.floor(
(600+floor*30)*scale
);

}

enemyHP=enemyMax;

document.getElementById(
"enemy"
).innerText=enemy;

update();

}


/* =========================
攻撃
========================= */

function playerAttack(){

if(battleEnd)return;

if(playerParalyze>0){

log("⚡麻痺して動けない！");

playerParalyze--;

enemyAttack();

return;

}

let dmg=
calcDamage(attack);

enemyHP-=dmg;

log(
"⚔ "+dmg+
" ダメージ"
);

playerMP=
Math.min(
playerMP+5,
playerMaxMP
);

battleCheck();

}


/* =========================
敵攻撃
========================= */

function enemyAttack(){

if(
enemyHP<=0 ||
battleEnd
)return;

if(enemyFreeze>0){

log("❄敵は凍っている！");

enemyFreeze--;

return;

}

if(enemyParalyze>0){

log("⚡敵は麻痺している！");

enemyParalyze--;

return;

}

let dmg=
Math.max(
1,
5+
floor-
defense
);


/* 200階以降 */

if(floor>=200){

let r=Math.random();

if(r<0.12){

dmg*=1.8;

log("👾強攻撃！");

}

}


/* ボスAI */

if(enemy.includes("ボス")){

let r=Math.random();


if(r<0.22){

dmg*=2;

log("🐉ボスの強攻撃！");

}

else if(r<0.38){

let heal=
Math.floor(
enemyMax*0.1
);

enemyHP=
Math.min(
enemyHP+heal,
enemyMax
);

log(
"🐉ボス回復 "+
heal
);

update();

return;

}

else if(r<0.50){

log("🛡ボス防御！");

dmg*=0.5;

}

else if(r<0.60){

if(Math.random()<0.5){

playerFreeze=1;

log("❄凍結した！");

}

}

else if(r<0.70){

if(Math.random()<0.5){

playerParalyze=1;

log("⚡麻痺した！");

}

}

}


if(enemy.includes("最終ボス")){

dmg*=1.5;

}


dmg=Math.floor(dmg);

playerHP-=dmg;

log(
"👾敵の攻撃 "+
dmg
);

if(playerHP<=0){

playerHP=0;

update();

gameOver();

return;

}

update();

}


/* =========================
戦闘判定
========================= */

function battleCheck(){

if(battleEnd)return;

if(enemyHP<=0){

battleEnd=true;

enemyHP=0;

gold+=10+floor;

exp+=5;

dropItem();


if(enemy.includes("ボス")){

gold+=150;

inventory.push(
createItem(true)
);

log("🎁ボス報酬！");

autoSell();

}


/* 最終ボス */

if(
enemy.includes("最終ボス")
){

backTowerUnlocked=true;

log(
"🌌裏の塔が解放された！"
);

document.getElementById(
"backTowerPanel"
).style.display="block";

}

levelUp();

autoSell();

update();

let token=battleToken;

setTimeout(()=>{

if(token!==battleToken)return;

nextFloor();

},400);

return;

}

enemyAttack();

update();

}


/* =========================
スキル
========================= */

let skills=[

{
name:"🔥",
cost:20,

action(){

if(battleEnd)return;

if(playerMP<20){

log("MP不足");

return;

}

playerMP-=20;

let dmg=
calcDamage(
attack*3
);

enemyHP-=dmg;

log(
"🔥 "+dmg
);

battleCheck();

}
},

{
name:"❄",
cost:15,

action(){

if(battleEnd)return;

if(playerMP<15){

log("MP不足");

return;

}

playerMP-=15;

let dmg=
calcDamage(
attack*2
);

enemyHP-=dmg;

if(Math.random()<0.5){

enemyFreeze=2;

log("❄凍結！");

}

log(
"❄ "+dmg
);

battleCheck();

}
},

{
name:"⚡",
cost:25,

action(){

if(battleEnd)return;

if(playerMP<25){

log("MP不足");

return;

}

playerMP-=25;

let dmg=
calcDamage(
attack*2.5
);

enemyHP-=dmg;

if(Math.random()<0.5){

enemyParalyze=2;

log("⚡麻痺！");

}

log(
"⚡ "+dmg
);

battleCheck();

}
},

{
name:"💖",
cost:15,

action(){

if(battleEnd)return;

if(playerMP<15){

log("MP不足");

return;

}

playerMP-=15;

let heal=40;

playerHP=
Math.min(
playerHP+heal,
playerMax
);

log(
"💖 "+heal+
"回復"
);

update();

enemyAttack();

}
},

{
name:"🩸",
cost:20,

action(){

if(battleEnd)return;

if(playerMP<20){

log("MP不足");

return;

}

playerMP-=20;

let dmg=
calcDamage(
attack*2
);

enemyHP-=dmg;

let heal=
Math.floor(
dmg/2
);

playerHP=
Math.min(
playerHP+heal,
playerMax
);

log(
"🩸 "+dmg+
" / 回復 "+
heal
);

battleCheck();

}
},

{
name:"✨",
cost:20,

action(){

if(battleEnd)return;

if(playerMP<20){

log("MP不足");

return;

}

playerMP-=20;

let heal=
Math.floor(
playerMax*0.25
);

playerHP=
Math.min(
playerHP+heal,
playerMax
);

log(
"✨ "+heal+
"回復"
);

update();

enemyAttack();

}
}

];


/* =========================
スキル表示
========================= */

function drawSkills(){

document.getElementById(
"skills"
).innerHTML=

skills.map(
(s,i)=>`

<button
onclick="skills[${i}].action()"
>
${s.name} ${s.cost}MP
</button>

`
).join("");

}


/* =========================
オート
========================= */

function autoBattle(){

if(!auto)return;

if(battleEnd)return;

let enemyDamage=
Math.max(
1,
5+
floor-
defense
);


/* 危険なら停止 */

if(
playerHP-
enemyDamage*2<=0
){

auto=false;

log(
"⚠オート停止"
);

updateAutoButton();

return;

}


/* 回復 */

if(
playerHP/playerMax<0.4 &&
playerMP>=15
){

skills[3].action();

return;

}


/* 優先スキル */

let p=
Number(
document.getElementById(
"prioritySkill"
).value
);

if(
playerMP>=skills[p].cost
){

skills[p].action();

}else{

playerAttack();

}

}

setInterval(
autoBattle,
900
);


function toggleAuto(){

auto=!auto;

updateAutoButton();

}


function updateAutoButton(){

document.getElementById(
"autoButton"
).innerText=
auto
?"🤖オート ON"
:"🤖オート OFF";

}


/* =========================
装備作成
========================= */

function createItem(boss=false){

let types=[
"sword",
"armor",
"ring"
];

let type=
types[
Math.floor(
Math.random()*3
)
];

let rarityIndex=
Math.floor(
Math.random()*5
);

if(boss){

rarityIndex=
Math.max(
2,
Math.floor(
Math.random()*5
)
);

}

let rarity=
rarities[rarityIndex];

let boost=
1+
Math.random()*2;

return{

id:
Date.now()+
Math.random(),

type,

rarity:rarityIndex,

atk:
Math.floor(
(Math.random()*20+
floor*0.5)
*
boost*
rarity.mult
),

def:
Math.floor(
Math.random()*15*
boost*
rarity.mult
),

mp:
Math.floor(
Math.random()*20*
boost*
rarity.mult
),

crit:
Math.random()*
0.05*
rarity.mult,

plus:0

};

}


/* =========================
装備名
========================= */

function getItemName(item){

let icon=
item.type==="sword"
?"⚔"
:
item.type==="armor"
?"🛡"
:"💍";

let typeName=
item.type==="sword"
?"剣"
:
item.type==="armor"
?"鎧"
:"指輪";

return `
${icon}${rarities[item.rarity].label}${typeName}
`;

}


/* =========================
インベントリ
========================= */

function drawInventory(){

document.getElementById(
"inventory"
).innerHTML=

inventory.map(
(item,index)=>`

<div class="item ${rarities[item.rarity].color}">

${getItemName(item)}
+${item.plus}

${
equipped[item.type]===item
?"<b>【装備中】</b>"
:""
}

<br>

ATK:${item.atk}<br>

DEF:${item.def}<br>

MP:${item.mp}<br>

CRIT:
${(item.crit*100).toFixed(1)}%

<br>

<button onclick="equip(${index})">
装備
</button>

<button onclick="upgrade(${index})">
強化
</button>

<button onclick="sell(${index})">
売却
</button>

</div>

`
).join("");

}


/* =========================
装備
========================= */

function equip(i){

let item=inventory[i];

if(!item)return;

let old=
equipped[item.type];

if(old===item){

log(
"すでに装備中"
);

return;

}

if(old){

attack-=old.atk;

defense-=old.def;

playerMaxMP-=old.mp;

critRate-=old.crit;

}

equipped[item.type]=item;

attack+=item.atk;

defense+=item.def;

playerMaxMP+=item.mp;

critRate+=item.crit;

playerMP=
Math.min(
playerMP,
playerMaxMP
);

log(
"🆙"+
getItemName(item)
);

drawInventory();

update();

}


/* =========================
強化
========================= */

function upgrade(i){

let item=inventory[i];

if(!item)return;

let cost=
Math.floor(
20*
Math.pow(
2,
item.plus
)
);

if(gold<cost){

log("💸金不足");

return;

}

let wasEquipped=
equipped[item.type]===item;

if(wasEquipped){

attack-=item.atk;

defense-=item.def;

playerMaxMP-=item.mp;

critRate-=item.crit;

}

gold-=cost;

item.plus++;

item.atk=
Math.floor(
item.atk*1.1
);

item.def=
Math.floor(
item.def*1.1
);

item.mp=
Math.floor(
item.mp*1.1
);

item.crit+=0.002;

if(wasEquipped){

attack+=item.atk;

defense+=item.def;

playerMaxMP+=item.mp;

critRate+=item.crit;

playerMP=
Math.min(
playerMP,
playerMaxMP
);

}

log(
"🔧強化 +"+
item.plus+
" / "+
cost+
"G"
);

drawInventory();

update();

}


/* =========================
売却
========================= */

function sell(i){

let item=inventory[i];

if(!item)return;

if(
equipped[item.type]===item
){

log(
"⚠装備中は売れません"
);

return;

}

let value=
20+
item.rarity*30+
item.plus*10;

gold+=value;

inventory.splice(i,1);

log(
"💰売却 +"+
value+
"G"
);

drawInventory();

update();

}


/* =========================
自動売却
========================= */

function readAutoSellSettings(){

autoSellEnabled=
document.getElementById(
"autoSellEnabled"
).checked;

autoSellLimit=
Number(
document.getElementById(
"autoSellLimit"
).value
)||30;

autoSellRarity=
Number(
document.getElementById(
"autoSellRarity"
).value
)||0;

autoSellATK=
Number(
document.getElementById(
"autoSellATK"
).value
)||0;

autoSellDEF=
Number(
document.getElementById(
"autoSellDEF"
).value
)||0;

autoSellMP=
Number(
document.getElementById(
"autoSellMP"
).value
)||0;

autoSellPlus=
Number(
document.getElementById(
"autoSellPlus"
).value
)||0;

autoSellRequireAll=
document.getElementById(
"autoSellRequireAll"
).checked;

}


/*
1個の装備が
自動売却条件に合うか
*/

function shouldAutoSell(item){

if(!item)return false;


/* 装備中は保護 */

if(
equipped[item.type]===item
)return false;


/* 指定レア度を超えるものは保護 */

if(
item.rarity>
autoSellRarity
){

return false;

}


/* 条件 */

let conditions=[

item.atk<=autoSellATK,

item.def<=autoSellDEF,

item.mp<=autoSellMP,

item.plus<=autoSellPlus

];


/*
すべて満たす
*/

if(autoSellRequireAll){

return conditions.every(Boolean);

}


/*
どれか1つ満たす
*/

return conditions.some(Boolean);

}


/*
自動売却本体
*/

function autoSell(){

readAutoSellSettings();

if(!autoSellEnabled)return;

if(
inventory.length<
autoSellLimit
)return;

let sold=0;
let money=0;

for(
let i=inventory.length-1;
i>=0;
i--
){

if(
inventory.length<
autoSellLimit
)break;

let item=
inventory[i];

if(
!shouldAutoSell(item)
)continue;

let value=
20+
item.rarity*30+
item.plus*10;

gold+=value;

money+=value;

inventory.splice(i,1);

sold++;

}

if(sold>0){

log(
"🤖自動売却 "+
sold+
"個 / +"+
money+
"G"
);

drawInventory();

update();

}

}

/*

i--

/* =========================
合成
========================= */

function combine(){

let found=null;

for(
let i=0;
i<inventory.length;
i++
){

let a=inventory[i];

if(a.plus<10)continue;

let same=
inventory.filter(
x=>
x.type===a.type &&
x.rarity===a.rarity &&
x.plus===a.plus
);

if(same.length>=3){

found={
item:a,
items:same.slice(0,3)
};

break;

}

}

if(!found){

log(
"🔨同じ装備3個が必要"
);

return;

}

let items=
found.items;

if(
items.some(
x=>
equipped[x.type]===x
)
){

log(
"⚠装備中は合成不可"
);

return;

}

if(
found.item.rarity>=4
){

log(
"最高レアです"
);

return;

}

items.forEach(item=>{

let index=
inventory.indexOf(item);

if(index>=0){

inventory.splice(
index,
1
);

}

});

let newItem=
JSON.parse(
JSON.stringify(
found.item
)
);

newItem.id=
Date.now()+
Math.random();

newItem.rarity++;

newItem.atk=
Math.floor(
newItem.atk*1.5
);

newItem.def=
Math.floor(
newItem.def*1.5
);

newItem.mp=
Math.floor(
newItem.mp*1.5
);

newItem.crit*=1.2;

inventory.push(
newItem
);

log(
"🔨合成成功！ "+
rarities[
newItem.rarity
].label
);

drawInventory();

}
